# Run an agent on a repo inside an ephemeral container, then verify with tests.
#
# Flow: provision a container, git-clone the `repo` below into /workspace, run the
# agent *inside* the container on the run's {task}, then `cargo test`. If the tests
# fail, the agent is asked to fix them (with the failure output) and they run
# again — looping until they pass. The container is destroyed when the run ends
# (success, failure, or cancel).
#
# The `repo` is a field of the `clone` node (edit it), not the run's {task} — the
# task is the agent's prompt. Use an HTTPS URL (the container has no SSH creds).
#
# The image must ship git, the toolchain the `test` step needs, AND the
# `boitata-agent` binary on PATH (that's what the `agent_sandbox` nodes launch and
# drive over ACP) — so point `image` at a purpose-built image, not a stock one.
# Build the matching image from the repo root (it stays local — provision uses a
# locally-present image as-is and only pulls a *missing* one, so nothing is
# published):
#   docker build -f examples/boitata-agent-rust.Dockerfile -t boitata-agent-rust:latest .
#
# The in-container agent is configured entirely by forwarded env vars.
# `provision.env` lists the variable *names* to forward; their values are read
# from the orchestrator's environment at run time — never written in this file,
# shown in the graph view, or logged. boitata reads:
#   BOITATA_API_KEY   — the provider key (required)
#   BOITATA_PROVIDER  — anthropic | openai | ollama (overrides the image default)
#   BOITATA_MODEL     — the model id
#   BOITATA_BASE_URL  — the endpoint (e.g. an OpenAI-compatible proxy)
# Any you don't set fall back to the image's baked config (see the Dockerfile,
# which defaults to a z.ai OpenAI-compatible endpoint). So point it at z.ai with:
#   BOITATA_API_KEY=<z.ai key> BOITATA_PROVIDER=openai BOITATA_MODEL=glm-4.6 \
#     BOITATA_BASE_URL=https://api.z.ai/api/paas/v4/chat/completions \
#     boitata run … --blueprint …/containerized_task.yaml
# Requires a running Docker daemon.
name: containerized_task
entry: provision
nodes:
  provision:
    type: provision
    image: "boitata-agent-rust:latest"
    env: [BOITATA_API_KEY, BOITATA_PROVIDER, BOITATA_MODEL, BOITATA_BASE_URL]
  clone:
    type: checkout
    container: "{provision}"
    repo: "https://github.com/BurntSushi/byteorder.git"
    path: /workspace
  work:
    type: agent_sandbox
    container: "{provision}"
    prompt: "Work on the repository in /workspace. Task: {task}"
  test:
    type: exec
    container: "{provision}"
    workdir: /workspace
    run: "cargo test"
  fix:
    type: agent_sandbox
    container: "{provision}"
    prompt: |
      `cargo test` failed for the repository in /workspace. Fix the code so the
      tests pass. The failing test output was:

      {test}
edges:
  - { from: provision, to: clone }
  - { from: clone, when: success, to: work }
  - { from: clone, when: failure, to: END }
  - { from: work, to: test }
  - { from: test, when: success, to: END }
  - { from: test, when: failure, to: fix }
  - { from: fix, to: test }
