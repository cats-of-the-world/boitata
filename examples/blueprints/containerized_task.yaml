# Run a task inside an ephemeral container: provision a container, git-clone the
# `repo` declared below into it, and run its tests there — a stand-in for
# delegating to an in-container agent. The container is destroyed automatically
# when the run ends (success, failure, or cancel).
#
# The repo to clone is a field of the `clone` node (edit it below), not the run's
# {task} — the task string is the agent's prompt, so it needn't be a URL. Use an
# HTTPS URL: the container has no SSH credentials. The image must ship git and the
# toolchain the `run` step needs. Requires a running Docker daemon.
name: containerized_task
entry: provision
nodes:
  provision:
    type: provision
    image: "rust:latest"
  clone:
    type: checkout
    container: "{provision}"
    repo: "https://github.com/BurntSushi/byteorder.git"
    path: /workspace
  test:
    type: exec
    container: "{provision}"
    workdir: /workspace
    run: "cargo test"
edges:
  - { from: provision, to: clone }
  - { from: clone, when: success, to: test }
  - { from: clone, when: failure, to: END }
  - { from: test, to: END }
