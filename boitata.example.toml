# Boitata configuration template.
#
# Copy this file to `boitata.toml` (which is git-ignored) and fill in your
# credentials. You can also leave `api_key` blank and export the key instead:
#
#     export BOITATA_API_KEY="your-key"
#
# By default the CLI looks for `boitata.toml` in the current directory. Override
# with `--config <path>` or the `BOITATA_CONFIG` environment variable.

# Provider to use: "anthropic", "openai", or "ollama".
provider = "openai"

# Model identifier passed to the provider.
model = "glm-4.6"

# API key. Prefer the BOITATA_API_KEY env var for real secrets.
api_key = ""

# Override the provider's default endpoint. For z.ai's OpenAI-compatible API:
base_url = "https://api.z.ai/api/paas/v4/chat/completions"

# Output token budget per request (optional; defaults to 4096).
max_tokens = 4096

# Maximum agent iterations before giving up (optional; defaults to 50).
# max_iterations = 50

# Custom system prompt (optional; a sensible default is used otherwise).
# system_prompt = "You are a helpful coding agent."

# Path to the JSONL audit log (optional; defaults to boitata-audit.log).
# Every run appends structured events here: run start, LLM responses, tool
# calls, token usage, and the final outcome.
# audit_log = "boitata-audit.log"

# Whether to register the arbitrary `execute_command` tool (default true). Set
# to false to restrict the agent to the structured tools (file, search, git_*,
# cargo_*) — it can then no longer run arbitrary shell commands.
# allow_execute_command = true

# --- Alternatives -----------------------------------------------------------
#
# z.ai Anthropic-compatible endpoint (native Anthropic Messages API):
#   provider = "anthropic"
#   model    = "glm-4.6"
#   base_url = "https://api.z.ai/api/anthropic/v1/messages"
#
# Local Ollama (no API key needed):
#   provider = "ollama"
#   model    = "llama3.2"
#   base_url = "http://localhost:11434"

# --- MCP servers ------------------------------------------------------------
#
# Connect to MCP (Model Context Protocol) servers. Each server's tools are
# discovered and exposed to the agent, namespaced as `<name>_<tool>`. A server
# that fails to start is logged and skipped — it won't abort the run.
#
# The transport is inferred from which field you set:
#   - `command` → stdio (the server is spawned as a subprocess)
#   - `url`     → Streamable HTTP (connect to a remote server)
# Set exactly one of the two per server.

# stdio (subprocess):
# [[mcp_servers]]
# name = "filesystem"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# [[mcp_servers]]
# name = "git"
# command = "uvx"
# args = ["mcp-server-git"]
# env = { GIT_AUTHOR_NAME = "boitata" }

# remote (Streamable HTTP):
# [[mcp_servers]]
# name = "remote"
# url = "https://mcp.example.com/mcp"
# auth_token = "your-token"                 # sent as `Authorization: Bearer <token>`
# headers = { X-Workspace = "acme" }        # optional extra headers
