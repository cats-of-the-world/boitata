[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["era"]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
# Concurrent futures (join_all for parallel blueprint super-steps)
futures = "0.3"
# CancellationToken for cooperative tool cancellation
tokio-util = "0.7.19"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# Config
toml = "1.1.3"
# YAML blueprint definitions (maintained fork of the unmaintained serde_yaml)
serde_norway = "0.9.42"

# Time
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# Unix process-group signalling (kill a timed-out command's whole tree)
libc = "0.2.189"

# Command denylist patterns for the tool permission policy
regex = "1.13.1"

# Token counting for context-window management (tiktoken o200k_base)
tiktoken-rs = "0.12"

# MCP (Model Context Protocol) client
rmcp = { version = "2.2.0", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }

# HTTP server (boitata-server): axum + tower middleware
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# Embed the built web UI into the server binary
rust-embed = "8"
mime_guess = "2"
# Ergonomic async generators for the SSE event stream
async-stream = "0.3"

# Internal crates
boitata-core = { path = "crates/boitata-core" }
boitata-agent = { path = "crates/boitata-agent" }
boitata-orchestrator = { path = "crates/boitata-orchestrator" }

# Dev-only
tokio-test = "0.4"
tempfile = "3"
